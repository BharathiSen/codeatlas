# Full CodeAtlas stack. Run from the repository root:
#   docker compose -f docker/docker-compose.yml --env-file .env up --build
#
# Five services: the web app, the ingestion/retrieval backend, Redis (cache and
# quota), Qdrant (vector store) and Postgres (saved conversations). Only the web
# app is published to the host — the rest talk over the compose network, which is
# why the backend's service token is the boundary that matters rather than port
# exposure.

name: codeatlas

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_API_KEY_SECONDARY: ${GEMINI_API_KEY_SECONDARY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in .env}
      GITINGEST_API_URL: http://backend:8000
      REDIS_URL: redis://redis:6379
      # Deliberately NOT interpolated from the root .env. This is the origin the
      # container calls itself on, and the container listens on 3000 — while the
      # same variable in .env is pinned to 3001 for `pnpm dev`. Inheriting it here
      # would point the self-warm request at a port nothing is bound to inside the
      # container, which fails silently rather than loudly.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INGEST_SERVICE_TOKEN: ${INGEST_SERVICE_TOKEN:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-20}
      AI_USER_DAILY_LIMIT: ${AI_USER_DAILY_LIMIT:-100}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TRUST_HOST: "true"
      # Pin the public origin in production instead of deriving it from the Host
      # header. AUTH_TRUST_HOST above is correct only behind a proxy you control;
      # setting AUTH_URL makes the OAuth callback independent of that header
      # entirely, which is the safer posture once this is internet-facing.
      AUTH_URL: ${AUTH_URL:-}
      # Behind a load balancer the client address arrives in X-Forwarded-For, and
      # 0 (the default) ignores that header — correct when exposed directly, but it
      # collapses every anonymous caller into the proxy's single quota bucket once
      # there is a proxy. Set to the number of trusted hops in production.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      DATABASE_URL: postgres://codeatlas:${POSTGRES_PASSWORD:-codeatlas}@postgres:5432/codeatlas
      # Matches the application default (collect-repo-data) and .env.example.
      # The preflight is sized to a 512 MB instance, so the compose default must
      # not quietly be 15x the documented ceiling — override in .env to raise it.
      MAX_REPO_SIZE_KB: ${MAX_REPO_SIZE_KB:-10000}
      MAX_PROMPT_TOKENS: ${MAX_PROMPT_TOKENS:-250000}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  # Applies database/migrations, then exits. The web app waits for it to succeed,
  # so a failed migration stops the deploy rather than letting the app serve
  # against a schema it does not match. `restart: "no"` matters: this is a task,
  # and a task that has already succeeded must not be run again on daemon restart.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://codeatlas:${POSTGRES_PASSWORD:-codeatlas}@postgres:5432/codeatlas
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      QDRANT_URL: http://qdrant:6333
      INGEST_SERVICE_TOKEN: ${INGEST_SERVICE_TOKEN:-}
      # Its own variable, not NEXT_PUBLIC_APP_URL. That one names the origin the web
      # container calls *itself* on (http://localhost:3000 inside the container);
      # this one names the origin a *browser* would call the backend from. Deriving
      # one from the other meant the documented CORS_ALLOWED_ORIGINS in .env was
      # ignored entirely and the dev-only port 3001 was injected instead — inert
      # today only because the backend publishes no ports (D-40).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # Saved conversations only. The app starts and answers questions without it;
  # `depends_on` exists so migrations have something to connect to, not because
  # answering needs a database.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codeatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeatlas}
      POSTGRES_DB: codeatlas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeatlas"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
  postgres-data:
