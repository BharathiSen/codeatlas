name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # No secrets are required: every integration reads its configuration at
      # request time, so an unconfigured build is still a valid build.
      - name: Build
        run: pnpm build

  backend:
    name: Backend — imports cleanly, tests pass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Import check
        run: python -c "import main; print('ingestion service imports OK')"

      # Chunking and retrieval decide answer quality and cost. They are tested
      # against a fake Qdrant and stubbed embeddings, so CI makes no paid calls.
      - name: Test
        run: python -m pytest -q

  retrieval-quality:
    name: Retrieval quality — recall@k
    runs-on: ubuntu-latest

    # Qdrant as a service container. The eval uses the local embedding provider,
    # so it needs no API key and no secrets — retrieval quality is measured on
    # every pull request rather than assumed.
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install fastembed

      # Cache the ONNX model (~130 MB) so only the first run pays for it.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-v1

      - name: Measure retrieval quality
        working-directory: backend
        env:
          EMBEDDING_PROVIDER: local
          QDRANT_URL: http://localhost:6333
        run: python -m eval.run_eval
