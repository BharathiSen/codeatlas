name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # CI discovered 6 of 8 test files once and still reported "all passing":
      # a suite that silently shrinks is the one kind of failure nobody notices.
      # Compare what is on disk against what vitest collects, and print both when
      # they disagree.
      - name: Verify every test file is discovered
        run: |
          set -euo pipefail
          find app components lib \( -name '*.test.ts' -o -name '*.test.tsx' \) \
            ! -name '*.integration.test.ts' | sed 's#^\./##' | sort > /tmp/on-disk.txt
          pnpm exec vitest list --filesOnly | sed 's#^\./##' | sort > /tmp/collected.txt
          if ! diff -u /tmp/on-disk.txt /tmp/collected.txt; then
            echo "::error::vitest did not collect every test file on disk"
            exit 1
          fi
          echo "$(wc -l < /tmp/collected.txt) test files, all discovered"

      - name: Test
        run: pnpm test

      # No secrets are required: every integration reads its configuration at
      # request time, so an unconfigured build is still a valid build.
      - name: Build
        run: pnpm build

  backend:
    name: Backend — imports cleanly, tests pass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Import check
        run: python -c "import main; print('ingestion service imports OK')"

      # Chunking and retrieval decide answer quality and cost. They are tested
      # against a fake Qdrant and stubbed embeddings, so CI makes no paid calls.
      - name: Test
        run: python -m pytest -q

  persistence:
    name: Persistence — schema and access control
    runs-on: ubuntu-latest

    # The properties worth testing here are claims about SQL: that a cascade
    # cascades, that a unique index makes concurrent upserts safe, and that one
    # user's id cannot reach another's conversation. A mocked database cannot
    # show any of them, so this job runs a real one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeatlas
          POSTGRES_PASSWORD: codeatlas
          POSTGRES_DB: codeatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeatlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: frontend

    env:
      DATABASE_URL: postgres://codeatlas:codeatlas@localhost:5432/codeatlas

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Migrations are checked in, so this also proves they apply cleanly to an
      # empty database — the thing that breaks a deploy, not a test.
      - name: Apply migrations
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test
        env:
          VITEST_INTEGRATION: "true"

  retrieval-quality:
    name: Retrieval quality — recall@k
    runs-on: ubuntu-latest

    # Qdrant as a service container. The eval uses the local embedding provider,
    # so it needs no API key and no secrets — retrieval quality is measured on
    # every pull request rather than assumed.
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install fastembed

      # Cache the ONNX model (~130 MB) so only the first run pays for it.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-v1

      - name: Measure retrieval quality
        working-directory: backend
        env:
          EMBEDDING_PROVIDER: local
          QDRANT_URL: http://localhost:6333
        run: python -m eval.run_eval
