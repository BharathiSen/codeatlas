<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="codeatlas-logo-title">
  <title id="codeatlas-logo-title">CodeAtlas</title>
  <defs>
    <linearGradient id="codeatlas-tile" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset=".52" stop-color="#10B981"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#codeatlas-tile)"/>

  <!-- Topographic contours: the atlas metaphor, legible down to 16px -->
  <g fill="none" stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
    <path d="M33 12.4c11.4-.4 19.9 7.5 19.3 17.2-.6 9.8-10 16.9-21 16.5-10.6-.4-18.5-7.7-17.9-17.5C14 19.1 22.4 12.8 33 12.4Z"
          stroke-width="3" stroke-opacity=".42"/>
    <path d="M32.7 20.7c6.7-.2 12 4.3 11.7 9.8-.3 5.5-5.8 9.5-12.3 9.3-6.3-.2-11.1-4.4-10.8-9.9.3-5.3 5.1-9 11.4-9.2Z"
          stroke-width="3" stroke-opacity=".72"/>
  </g>

  <!-- Position marker -->
  <circle cx="32.4" cy="30.2" r="4.1" fill="#FFFFFF"/>
</svg>
