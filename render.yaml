# render.yaml — CodeAtlas, Render FREE tier blueprint
#
# ── THIS IS A DEMO / PORTFOLIO DEPLOYMENT, NOT A PRODUCTION ONE ─────────────
# Render's Free tier cannot provide production-grade persistence or
# availability, and this blueprint does not pretend otherwise:
#
#   * Free web services SPIN DOWN after 15 minutes without inbound traffic and
#     take roughly a minute to wake. First request after idle is slow.
#   * Free Postgres EXPIRES 30 DAYS AFTER CREATION (then a 14-day grace period
#     before deletion). Saved conversations are temporary by construction.
#   * Free Key Value DOES NOT PERSIST TO DISK — every restart wipes it. That
#     resets the daily AI quota counters, so the spend ceiling is weaker here
#     than anywhere else CodeAtlas runs.
#   * Only ONE free Postgres and ONE free Key Value may be active per workspace.
#   * Outbound bandwidth and build-pipeline minutes are capped monthly.
#
# For a real deployment, move every `plan: free` below to a paid tier and
# restore the cron migration service — see §20 of docs/ENGINEERING_NOTEBOOK.md.
# ────────────────────────────────────────────────────────────────────────────
#
# Three declared services and one database; two dependencies are external or
# manual:
#
#   codeatlas-web          Next.js app, built from docker/Dockerfile
#   codeatlas-ingest-api   FastAPI ingestion + retrieval service (backend/)
#   codeatlas-keyvalue     cache + quota store (ephemeral on Free)
#   codeatlas-postgres     saved conversations (expires after 30 days on Free)
#
#   Qdrant                 EXTERNAL — Render has no managed vector database.
#                          Point QDRANT_URL at a Qdrant Cloud cluster. Without
#                          it the app still ingests and falls back to
#                          whole-repository context; retrieval simply stays off.
#
#   migrations             MANUAL — see the block below. Cron jobs are not
#                          available on the Free instance type, so the schema
#                          must be applied by hand before the first deploy.
#
# ── MANUAL MIGRATION PROCEDURE (run BEFORE the first web deploy) ────────────
# The application must not start against an uninitialised database: without the
# schema, every saved-conversation call degrades to "not persisted" silently.
#
#   1. Provision codeatlas-postgres (apply this blueprint, or create it first).
#   2. Copy its EXTERNAL connection string from the Render dashboard. The
#      internal URL only resolves inside Render's network.
#
#      IT MUST CARRY `?sslmode=require`. Render Postgres refuses non-TLS
#      connections, and drizzle.config.ts passes no TLS options of its own — it
#      hands the URL straight to postgres.js. Without the parameter the connect
#      fails and drizzle-kit's progress spinner swallows the error, so the run
#      reports only `exit code 1` with no cause. Verified on the first real
#      deployment: identical command, sslmode appended, migrations applied.
#   3. From the repository's frontend/ directory, with the URL supplied in the
#      shell — never written to a file, never committed:
#
#        # bash / zsh
#        cd frontend
#        DATABASE_URL='<external-connection-string>' pnpm db:migrate
#
#        # PowerShell
#        cd frontend
#        $env:DATABASE_URL='<external-connection-string>'; pnpm db:migrate
#
#      A shell variable takes precedence over the repo-root .env, because
#      drizzle.config.ts loads that file without `override`. Confirm you are
#      pointed at Render and not at a local database before running it.
#   4. Verify: the database should now contain conversations, messages,
#      repositories and users.
#   5. Only then deploy codeatlas-web.
#
# RENDER FREE CANNOT ENFORCE MIGRATION-BEFORE-DEPLOY ORDERING. There is no
# equivalent of compose's `service_completed_successfully` and no pre-deploy
# hook on this tier. Every FUTURE schema change must also be applied by hand,
# BEFORE deploying the application version that depends on it. Migrations are
# forward-only; there is no rollback path.
#
# The migration SQL and its architecture are unchanged — database/migrations/
# is still the single source of truth, still generated by drizzle-kit, and is
# what step 3 applies. Only the *runner* moved from a cron service to your
# terminal.
# ────────────────────────────────────────────────────────────────────────────
#
# Every `sync: false` value is set in the Render dashboard and never committed.
# No production URLs are hardcoded — the final Render hostnames are not known
# until the services exist.

services:
  # ── Web application ───────────────────────────────────────────────────────
  # Built from docker/Dockerfile with the repository root as context, which is
  # what that Dockerfile expects (it copies frontend/ and database/). The final
  # stage is `runner`, so no build target has to be selected — Render
  # Blueprints have no field for one.
  #
  # `next start` honours $PORT: next.config.mjs treats PORT as reserved only to
  # stop a .env file injecting it, so Render's assigned port passes through.
  - type: web
    name: codeatlas-web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      # Secrets — set in the dashboard.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_SECONDARY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      # Shared secret with the ingestion service. Must match the value set on
      # codeatlas-ingest-api exactly, or every /ingest/, /index/ and /search/
      # call returns 401.
      - key: INGEST_SERVICE_TOKEN
        sync: false

      # Wired by Render.
      - key: DATABASE_URL
        fromDatabase:
          name: codeatlas-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: codeatlas-keyvalue
          type: keyvalue
          property: connectionString

      # Origins. All three must name the same public URL, and the OAuth app's
      # callback must be <that origin>/api/auth/callback/github. Left unset here
      # deliberately: the Render hostname is not known until the service exists.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_URL
        sync: false
      # The ingestion service's URL. Not derived from the service below because
      # a scheme-qualified base URL is needed, not a bare host.
      - key: GITINGEST_API_URL
        sync: false

      # Render terminates TLS and proxies to the service, so the client address
      # arrives one hop away in X-Forwarded-For. Left at 0 the header is ignored
      # and every anonymous caller shares the proxy's single quota bucket.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

  # ── Ingestion + retrieval service ─────────────────────────────────────────
  # Publicly reachable, so INGEST_SERVICE_TOKEN is the only thing standing
  # between the internet and endpoints that spend money on embeddings. It is
  # not optional here, unlike in local compose where nothing was published.
  #
  # On Free this also spins down after 15 minutes. The web app's ingestion call
  # will then pay a cold start, and may time out on the first attempt — the
  # documented fallback to whole-repository context covers it, so questions
  # still answer.
  - type: web
    name: codeatlas-ingest-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ping
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: INGEST_SERVICE_TOKEN
        sync: false
      # Qdrant Cloud endpoint. External by necessity — Render has no managed
      # vector database on any tier.
      - key: QDRANT_URL
        sync: false
      # Required for Qdrant Cloud. Without it the client is refused with a bare
      # 403 and retrieval silently degrades to whole-repository context.
      - key: QDRANT_API_KEY
        sync: false
      # Browser origins allowed to call this service. Set to the web app's
      # public origin — not to a localhost value (D-40).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMBEDDING_DIMENSIONS
        value: "768"

  # ── Cache and quota store ─────────────────────────────────────────────────
  # An empty ipAllowList means reachable only from inside the Render network.
  #
  # On Free this instance does not persist to disk: a restart wipes the
  # repository cache, the answer cache AND the daily quota counters. Cache loss
  # is harmless. Quota loss is not — it resets the spend ceiling in front of a
  # paid model API, so watch usage rather than trusting the counter here.
  - type: keyvalue
    name: codeatlas-keyvalue
    plan: free
    ipAllowList: []

# ── Saved conversations ─────────────────────────────────────────────────────
# The only durable application state — and on Free it is not durable at all:
# the database expires 30 days after creation. Everything else (repository
# cache, answer cache, quota counters, Qdrant index) can be rebuilt by
# re-ingesting. Omit this entirely and CodeAtlas still answers questions;
# conversations simply stop persisting (D-31).
databases:
  - name: codeatlas-postgres
    plan: free
